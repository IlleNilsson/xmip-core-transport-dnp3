# Its own workspace root, so this repository builds on its own.
[workspace]

[package]
name = "xmip-core-transport-dnp3"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/IlleNilsson/xmip-core-transport-dnp3"
description = "DNP3 transport: one application fragment is one Stream, reassembled from its link frames and transport segments; a Location listens as the outstation or connects as the master. IEEE 1815 over TCP. A xmip-core-transport technology."
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md). Standard library otherwise: DNP3 is two start bytes, a length
# and CRCs.
transport = { package = "xmip-core-transport", git = "https://github.com/IlleNilsson/xmip-core-transport", branch = "main" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
too_many_lines = "warn"
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
missing_panics_doc = "warn"
unwrap_used = "warn"
expect_used = "allow"
